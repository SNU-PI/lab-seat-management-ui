<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>연구실 자리 관리</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="topbar">
    <h1>🪑 연구실 자리 현황</h1>
    <span class="pill">● 1분마다 갱신</span>
    <button class="btn" id="refreshBtn" type="button">↻ 새로고침</button>
    <div class="spacer"></div>
    <a class="btn" href="/admin">⚙️ 어드민</a>
  </div>

  <div class="wrap">
    <p class="muted" style="margin-top:0">방 제목을 누르면 상세 현황으로 이동합니다.</p>
    <div id="boards"></div>

    <div class="legend">
      <span><i style="background:var(--seat-vacant-bg);border:1px solid var(--seat-vacant)"></i> 공석</span>
      <span><i style="background:var(--seat-occupied-bg);border:1px solid var(--seat-occupied)"></i> 사용 중</span>
      <span><i style="background:#3b2f12;border:1px solid #a16207"></i> 🕒 이용시간 외</span>
      <span><i style="background:#4b5563;border:1px solid #64748b"></i> 사용불가</span>
      <span><i style="background:var(--furniture)"></i> 가구</span>
      <span><i style="background:var(--door)"></i> 문</span>
      <span><i style="background:var(--window)"></i> 창문</span>
    </div>
  </div>

  <script src="/util.js"></script>
  <script src="/index.js"></script>
</body>
</html>
